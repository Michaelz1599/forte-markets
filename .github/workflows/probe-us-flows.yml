name: probe-us-flows (temporary)
on:
  push:
    branches: ["probe/us-flows"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -q -r requirements.txt
      - run: python -m tools.probe.us_flows_probe
      - run: |
          git config user.name "probe"; git config user.email "probe@users.noreply.github.com"
          git add -f probe_out && git commit -q -m "probe data" && git push -q origin HEAD:probe/us-flows
