# Daily market data for the foreign-equity exposure dashboard (דשבורד חשיפות – תיק מניות חו"ל, a local HTML file).
# After each US session: ETF holdings from the issuers' daily files, Yahoo prices, and a rotating slice of Yahoo
# fundamentals, turned into factor scores (tools/expo/build.py). Writes data/expo/market.json, which the dashboard
# reads from raw.githubusercontent.com when it is opened. Public market data only: fund holdings never come here.
# Independent of update.yml (it only writes data/expo/, which update.yml never touches), so it has its own
# concurrency group and simply rebases on push.
name: expo-daily
on:
  schedule:
    - cron: "20 4 * * 2-6"    # Tue-Sat 06:20 Israel winter / 07:20 summer (+ GitHub's usual delay), after the US close
  workflow_dispatch:
    inputs:
      fund_max:
        description: "Names whose fundamentals are refreshed (oldest first)"
        default: "160"
      fund_budget:
        description: "Seconds for the fundamentals"
        default: "900"
permissions:
  contents: write
concurrency:
  group: expo-daily
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -q -r requirements.txt
      - name: Build data/expo
        run: python tools/expo/build.py --fund-max "${{ inputs.fund_max || '160' }}" --fund-budget "${{ inputs.fund_budget || '900' }}"
      - name: Commit
        if: always()
        run: |
          git config user.name "forte-markets-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/expo
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "expo: daily $(TZ=Asia/Jerusalem date +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && { echo pushed; exit 0; }
            sleep $((i * 10))
          done
          echo "::error::push failed"; exit 1
