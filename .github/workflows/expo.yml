# Daily market data for the foreign-equity exposure dashboard (דשבורד חשיפות – תיק מניות חו"ל, a local HTML file).
# After each US session: ETF holdings from the issuers' daily files, Yahoo prices, and a rotating slice of Yahoo
# fundamentals, turned into factor scores (tools/expo/build.py). Writes data/expo/market.json, which the dashboard
# reads from raw.githubusercontent.com when it is opened. Public market data only: fund holdings never come here.
# Independent of update.yml (it only writes data/expo/, which update.yml never touches), so it has its own
# concurrency group and simply rebases on push.
# GitHub starts scheduled runs hours late (the 04:20 slot ran at 14:30 UTC on 24-25.11.2026), so the job also starts
# after every run of the main pipeline (forte-markets-update, which runs many times a night), and a gate
# (tools/expo/gate.py) lets a run build only when the data is not yet as of the last finished US session.
name: expo-daily
on:
  workflow_run:
    workflows: ["forte-markets-update"]
    types: [completed]
  schedule:
    - cron: "40 21 * * 1-5"   # backups, in case the main pipeline does not run: after the US close
    - cron: "50 23 * * 1-5"
    - cron: "20 2 * * 2-6"
    - cron: "20 4 * * 2-6"
  workflow_dispatch:
    inputs:
      fund_max:
        description: "Names whose fundamentals are refreshed (oldest first)"
        default: "160"
      fund_budget:
        description: "Seconds for the fundamentals"
        default: "900"
permissions:
  contents: write
concurrency:
  group: expo-daily
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Gate (skip when the data is already as of the last US close)
        id: gate
        if: github.event_name != 'workflow_dispatch'
        run: python3 tools/expo/gate.py >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -q -r requirements.txt
        if: steps.gate.outputs.skip != 'true'
      - name: Build data/expo
        if: steps.gate.outputs.skip != 'true'
        run: python tools/expo/build.py --fund-max "${{ inputs.fund_max || '160' }}" --fund-budget "${{ inputs.fund_budget || '900' }}"
      - name: Commit
        if: always() && steps.gate.outputs.skip != 'true'
        run: |
          git config user.name "forte-markets-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/expo
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "expo: daily $(TZ=Asia/Jerusalem date +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && { echo pushed; exit 0; }
            sleep $((i * 10))
          done
          echo "::error::push failed"; exit 1
