name: probe-jkp (temporary)
on:
  push:
    branches: ["probe/jkp-israel"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -q -r requirements.txt
      - run: |
          rm -f data/derived/jkp_il.json
          python -c "from pipeline import jkp; o, m = jkp.run(); print('FIRST', m)"
          python -c "from pipeline import jkp; o, m = jkp.run(); print('SECOND', m)"
          mkdir -p probe_out2 && cp data/derived/jkp_il.json probe_out2/ && python -c "from pipeline import jkp; o, m = jkp.run(); print('THIRD', m)" > probe_out2/msg.txt
      - run: |
          git config user.name "probe"; git config user.email "probe@users.noreply.github.com"
          git add -f probe_out2 && git commit -q -m "probe: jkp module" && git push -q origin HEAD:probe/jkp-israel
