name: probe-jkp (temporary)
on:
  push:
    branches: ["probe/jkp-israel"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q requests==2.34.2
      - run: python tools/probe/jkp_probe.py
      - run: |
          git config user.name "probe"; git config user.email "probe@users.noreply.github.com"
          git add -f probe_out && git commit -q -m "probe data" && git push -q origin HEAD:probe/jkp-israel
