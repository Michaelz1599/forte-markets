# Temporary: probe data sources for the Buffett indicator. Lives only on the probe-buffett branch.
name: probe-buffett
on:
  push:
    branches: [probe-buffett]
    paths: ["tools/probe_buffett.py", ".github/workflows/probe-buffett.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -q -r requirements.txt
      - run: python tools/probe_buffett.py
      - run: |
          git config user.name "forte-markets-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/probe_buffett state/probe_buffett2
          git commit -q -m "probe: buffett sources 2" || exit 0
          git push -q origin HEAD:probe-buffett
